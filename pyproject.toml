[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scengen"
version = "0.0.1"
description = "Streamflow scenario-ensemble generation and ensemble-quality diagnostics for the NYC reservoir scenario-design study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

# Local sibling packages are expected to be installed editable in the same venv:
#   pip install -e ../SynHydro
# (kept out of [project.dependencies] because they are path installs, not PyPI.)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
